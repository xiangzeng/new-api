name: Deploy new-api to Hong Kong

on:
  workflow_run:
    workflows:
      - Build and Push Docker Image
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hk-new-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Blue-green deploy (zero-downtime)
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    # 服务器脚本两次排空各最多 900s，加上拉镜像、重建与健康检查最坏约 35 分钟
    timeout-minutes: 45

    env:
      DEPLOY_HOST: ${{ secrets.NEW_API_HK_HOST }}
      DEPLOY_PORT: ${{ secrets.NEW_API_HK_PORT }}
      DEPLOY_USER: ${{ secrets.NEW_API_HK_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.NEW_API_HK_SSH_KEY }}

    steps:
      - name: Check deploy secrets
        run: |
          : "${DEPLOY_HOST:?Missing NEW_API_HK_HOST secret}"
          : "${DEPLOY_PORT:?Missing NEW_API_HK_PORT secret}"
          : "${DEPLOY_USER:?Missing NEW_API_HK_USER secret}"
          : "${DEPLOY_SSH_KEY:?Missing NEW_API_HK_SSH_KEY secret}"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/new-api-hk
          chmod 600 ~/.ssh/new-api-hk
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # 蓝绿部署：脚本先把流量切到备用实例、等在途请求排空，再重建另一实例，
      # 全程 nginx 只 reload，不会掐断用户正在跑的流式请求。通常几分钟，
      # 取决于被切走实例上最长的在途请求，最坏约 35 分钟。
      - name: Blue-green deploy new-api
        run: |
          ssh -i ~/.ssh/new-api-hk -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -euo pipefail
          /root/new-api/deploy-bluegreen.sh
          REMOTE

  # 美国从节点（us.relayaicheap.com）：两个实例都是 NODE_TYPE=slave，数据库迁移由香港主节点完成，
  # 所以必须等香港部署成功后再部署。部署密钥在美国机 authorized_keys 里绑定了
  # command="/root/new-api/deploy-bluegreen.sh",restrict，只能触发这一个脚本。
  deploy-us:
    name: Blue-green deploy US slave node (zero-downtime)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DEPLOY_HOST: ${{ secrets.NEW_API_US_HOST }}
      DEPLOY_PORT: ${{ secrets.NEW_API_US_PORT }}
      DEPLOY_USER: ${{ secrets.NEW_API_US_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.NEW_API_US_SSH_KEY }}

    steps:
      - name: Check deploy secrets
        run: |
          : "${DEPLOY_HOST:?Missing NEW_API_US_HOST secret}"
          : "${DEPLOY_PORT:?Missing NEW_API_US_PORT secret}"
          : "${DEPLOY_USER:?Missing NEW_API_US_USER secret}"
          : "${DEPLOY_SSH_KEY:?Missing NEW_API_US_SSH_KEY secret}"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/new-api-us
          chmod 600 ~/.ssh/new-api-us
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # 服务器端的强制命令会执行部署脚本，这里不需要再传命令
      - name: Blue-green deploy new-api (US)
        run: |
          ssh -i ~/.ssh/new-api-us -o IdentitiesOnly=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
